<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Price Predictor - Better Call Saul Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* wood desing in CSS */
        .wood-bg {
            background-color: #4a2c11;
            background-image: repeating-linear-gradient(
                90deg,
                #5c3a21 0px,
                #5c3a21 120px,
                #4a2c11 121px,
                #4a2c11 130px,
                #6d442a 131px,
                #6d442a 240px,
                #3b220c 241px,
                #3b220c 250px
            );
        }
    </style>
</head>
<body class="wood-bg min-h-screen p-4 md:p-12 flex items-center justify-center">

    <div class="w-full max-w-6xl grid grid-cols-1 lg:grid-cols-3 gap-8 items-stretch">
        
        <div class="bg-amber-400 border-8 border-red-600 rounded-3xl p-6 shadow-2xl flex flex-col justify-between items-center text-center transform -rotate-1 hover:rotate-0 transition duration-300">
            <div>
                <h2 class="text-red-600 font-black text-4xl tracking-tighter uppercase font-serif">BETTER CALL SAUL!</h2>
                <p class="text-blue-900 font-bold text-xl mt-1 tracking-wide">Are your property estimates criminal?</p>
            </div>

            <div class="my-6 text-blue-950">
                <svg width="160" height="200" viewBox="0 0 24 24" fill="currentColor" class="mx-auto transform scale-x-[-1]">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
                <div class="bg-red-600 text-white font-black text-lg px-4 py-1 rounded border-2 border-white uppercase animate-bounce mt-2">
                    "Better use HousePrediction website!"
                </div>
            </div>

            <div class="border-t-4 border-dashed border-blue-900 pt-4 w-full">
                <p class="text-sm font-extrabold text-blue-950">DON'T LET THE MARKETS ROB YOU!</p>
                <p class="text-xs text-blue-900 mt-1">Available 24/7 • 505-503-4455</p>
            </div>
        </div>

        <div class="lg:col-span-2 bg-stone-100 p-8 rounded-3xl shadow-2xl border-4 border-stone-300 flex flex-col justify-between">
            <div>
                <div class="flex items-center gap-3 mb-2">
                    <span class="text-4xl">🏠</span>
                    <h1 class="text-3xl font-black text-stone-800 tracking-tight">House Price Champion</h1>
                </div>
                <p class="text-stone-600 mb-6 font-medium">Enter the house details to get an instant, legally-defensible market valuation.</p>
                
                <div id="form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase text-stone-700 mb-1">Bedrooms</label>
                        <input type="number" id="Bedrooms" value="3" class="w-full p-2.5 bg-white border-2 border-stone-300 rounded-xl focus:border-amber-500 focus:ring-0 font-semibold text-stone-800">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-stone-700 mb-1">Bathrooms</label>
                        <input type="number" id="Bathrooms" step="0.5" value="2.5" class="w-full p-2.5 bg-white border-2 border-stone-300 rounded-xl focus:border-amber-500 focus:ring-0 font-semibold text-stone-800">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-stone-700 mb-1">Living Space (m²)</label>
                        <input type="number" id="m2_Living" value="185" class="w-full p-2.5 bg-white border-2 border-stone-300 rounded-xl focus:border-amber-500 focus:ring-0 font-semibold text-stone-800">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-stone-700 mb-1">Total Size (m²)</label>
                        <input type="number" id="m2_Lot" value="465" class="w-full p-2.5 bg-white border-2 border-stone-300 rounded-xl focus:border-amber-500 focus:ring-0 font-semibold text-stone-800">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-stone-700 mb-1">Floors</label>
                        <input type="number" id="Floors" step="0.5" value="1.0" class="w-full p-2.5 bg-white border-2 border-stone-300 rounded-xl focus:border-amber-500 focus:ring-0 font-semibold text-stone-800">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-stone-700 mb-1">Waterfront (0 or 1)</label>
                        <input type="number" id="Waterfront" min="0" max="1" value="0" class="w-full p-2.5 bg-white border-2 border-stone-300 rounded-xl focus:border-amber-500 focus:ring-0 font-semibold text-stone-800">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-stone-700 mb-1">View (0 to 4)</label>
                        <input type="number" id="view" min="0" max="4" value="0" class="w-full p-2.5 bg-white border-2 border-stone-300 rounded-xl focus:border-amber-500 focus:ring-0 font-semibold text-stone-800">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-stone-700 mb-1">Condition (1 to 5)</label>
                        <input type="number" id="Condition" min="1" max="5" value="3" class="w-full p-2.5 bg-white border-2 border-stone-300 rounded-xl focus:border-amber-500 focus:ring-0 font-semibold text-stone-800">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-xs font-bold uppercase text-stone-700 mb-1">Basement Size (m²)</label>
                        <input type="number" id="m2_Basement" value="0" class="w-full p-2.5 bg-white border-2 border-stone-300 rounded-xl focus:border-amber-500 focus:ring-0 font-semibold text-stone-800">
                    </div>
                    
                    <button onclick="predict()" class="md:col-span-2 mt-4 bg-red-600 text-white font-black py-4 rounded-xl hover:bg-red-700 transition duration-300 shadow-xl text-lg uppercase tracking-wider">
                        Get Estimated Price
                    </button>
                </div>
            </div>

            <div>
                <div id="result-container" class="hidden mt-6 p-5 bg-green-100 border-4 border-green-400 rounded-2xl animate-pulse">
                    <p class="text-xs text-green-800 text-center uppercase tracking-widest font-black">Guaranteed Market Value</p>
                    <div id="result" class="text-4xl font-black text-green-700 text-center mt-1"></div>
                </div>

                <div id="error" class="hidden mt-4 p-4 bg-red-100 text-red-700 border-2 border-red-400 rounded-2xl text-center font-bold"></div>
            </div>
        </div>

    </div>

    <script>
        async function predict() {
            document.getElementById('result-container').classList.add('hidden');
            document.getElementById('error').classList.add('hidden');

            const m2ToSqft = 10.7639;

            const data = {
                Bedrooms: parseInt(document.getElementById('Bedrooms').value),
                Bathrooms: parseFloat(document.getElementById('Bathrooms').value),
                Sqft_Living: Math.round(parseFloat(document.getElementById('m2_Living').value) * m2ToSqft),
                Sqft_lot: Math.round(parseFloat(document.getElementById('m2_Lot').value) * m2ToSqft),
                Floors: parseFloat(document.getElementById('Floors').value),
                Waterfront: parseInt(document.getElementById('Waterfront').value),
                view: parseInt(document.getElementById('view').value),
                Condition: parseInt(document.getElementById('Condition').value),
                Sqft_Basement: Math.round(parseFloat(document.getElementById('m2_Basement').value) * m2ToSqft)
            };

            try {
                const response = await fetch('https://house-price-prediction-439u.onrender.com/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    background: 'transparent',
                    body: JSON.stringify(data)
                });

                if (!response.ok) throw new Error('API connection failed or invalid data');

                const result = await response.json();
                
                document.getElementById('result-container').classList.remove('hidden');
                document.getElementById('result').innerText = `$${result.estimated_price.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
            } catch (err) {
                document.getElementById('error').classList.remove('hidden');
                document.getElementById('error').innerText = "Error: Could not reach the API. Saul's servers might be busy!";
            }
        }
    </script>
</body>
</html>
